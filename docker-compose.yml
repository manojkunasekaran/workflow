services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI  →  http://localhost:15672  (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - workflow-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - workflow-network

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - workflow-network

  # ── Backend ──────────────────────────────────────────────────────────
  # Build the shared modules into the Maven local repository.
  build-libs:
    build:
      context: ./backend
      dockerfile: Dockerfile.build-libs
    volumes:
      - ./backend:/app
      - maven-repo:/root/.m2
    restart: "no"
    networks:
      - workflow-network

  core:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        APP_MODULE: core
    ports:
      - "8081:8081" # Spring Boot HTTP / Actuator
      - "9090:9090" # gRPC server
      - "9000:9000" # JVM remote debug
    env_file:
      - backend/.env
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    depends_on:
      build-libs:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - workflow-network
    volumes:
      - ./backend:/app
      - maven-repo:/root/.m2

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        APP_MODULE: api
    ports:
      - "8080:8080" # Spring Boot HTTP / REST
      - "8000:8000" # JVM remote debug
    env_file:
      - backend/.env
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    depends_on:
      build-libs:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - workflow-network
    volumes:
      - ./backend:/app
      - maven-repo:/root/.m2

networks:
  workflow-network:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  rabbitmq_data:
  redis_data:
  maven-repo:
