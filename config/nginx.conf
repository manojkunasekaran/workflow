server {
    listen 80;
    server_name _;

    # ---- Frontend (React/Vite static build) -------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: any non-file route goes to index.html for React Router
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API reverse proxy -------------------------------------------------
    # Backend already expects the /rest prefix itself, so we preserve it
    # (both location and proxy_pass end in /rest/, so nginx passes the path through unchanged)
    location /rest/ {
        proxy_pass http://api:8080/rest/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    client_max_body_size 20m;
}
