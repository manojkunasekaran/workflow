syntax = "proto3";

option java_package = "com.app.messaging.grpc";
option java_multiple_files = true;
option java_outer_classname = "WorkflowServiceProto";

service WorkflowService {
    rpc ProcessExecution(ProcessExecutionRequest) returns (EmptyResponse);
}

message ProcessExecutionRequest {
    string execution_id = 1;
}

message EmptyResponse {}
