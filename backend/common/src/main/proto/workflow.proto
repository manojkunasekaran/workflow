syntax = "proto3";

// Defines the Java package name for the generated gRPC classes
option java_package = "com.app.common.grpc";
option java_multiple_files = true;
option java_outer_classname = "WorkflowServiceProto";

// Service Definition
service WorkflowService {
    // Execution only needs the ID. Core will load the definition and start it.
    rpc TriggerExecution(TriggerExecutionRequest) returns (WorkflowExecutionResponse);
    // Task response from an API client (like responding to a human task form)
    rpc RespondToHumanTask(HumanTaskResponseRequest) returns (EmptyResponse);
}

// Minimal representation needed to request a workflow trigger
message TriggerExecutionRequest {
    string workflow_id = 1;
}

// Minimal representation needed to return an execution ID
message WorkflowExecutionResponse {
    string execution_id = 1;
    string status = 2; // Usually "RUNNING"
    string execution_json = 3; // Fully serialized WorkflowExecution object
}

// Minimal representation for an API task response
message HumanTaskResponseRequest {
    string execution_id = 1;
    string task_execution_id = 2;
    string action_id = 3;
    string responded_by = 4;
    // Simple JSON string for form data instead of complex protobuf structs
    string form_data_json = 5;
}

// Custom empty response (avoids google.protobuf.Empty import issues)
message EmptyResponse {}

