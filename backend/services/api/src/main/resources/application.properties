spring.application.name=workflow-api
server.port=8080
server.servlet.context-path=/rest

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:workflow}
logging.level.org.springframework.web=TRACE


# gRPC Client Configuration
grpc.client.core-service.address=${GRPC_CLIENT_CORE_SERVICE_ADDRESS:static://localhost:9090}
grpc.client.core-service.negotiation-type=plaintext
grpc.client.core-service.enable-keep-alive=true
grpc.client.core-service.keep-alive-time=30s
grpc.client.core-service.keep-alive-timeout=5s

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Message Queue (RabbitMQ) Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000ms
spring.rabbitmq.template.retry.max-attempts=3

workflow.messaging.rabbit.retry-interval-ms=5000

# Connector manifest seeding (deferred; does not block startup)
workflow.persistence.connector.seed-initial-delay-ms=0
workflow.persistence.connector.seed-retry-interval-ms=5000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Workflow Execution Configuration
workflow.api.execution.sync-timeout-seconds=300

# Poll Trigger Configuration
workflow.api.poll.min-interval-seconds=30
workflow.api.poll.max-interval-seconds=86400
workflow.api.poll.max-items-per-poll=1000
workflow.api.poll.max-tracked-keys=10000
workflow.api.poll.max-consecutive-failures=5

# Webhook Trigger Configuration
workflow.api.webhook.public-base-url=http://localhost:8080/rest
workflow.api.webhook.token-length=32
workflow.api.webhook.dedup-ttl-days=7
workflow.api.webhook.max-consecutive-failures=5
workflow.messaging.execution.sync-timeout-seconds=300

# Security
workflow.crypto.encryption-key=${ENCRYPTION_KEY}

# OAuth2 — public URLs (must match provider app registration)
workflow.api.base-url=${WORKFLOW_API_BASE_URL:http://localhost:8080}
workflow.frontend.base-url=${WORKFLOW_FRONTEND_BASE_URL:http://localhost:5173}
# Managed OAuth client id/secret: configure in Platform Admin → Apps → (OAuth app) → Managed OAuth

# Auth: demo (default) | oauth — all modes use server session + cookie
workflow.auth.mode=${WORKFLOW_AUTH_MODE:demo}
# OAuth (only when workflow.auth.mode=oauth)
workflow.auth.oauth.client-id=${OAUTH_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID:}}
workflow.auth.oauth.client-secret=${OAUTH_CLIENT_SECRET:${GOOGLE_OAUTH_CLIENT_SECRET:}}
workflow.auth.platform-admin-emails=${PLATFORM_ADMIN_EMAILS:}
