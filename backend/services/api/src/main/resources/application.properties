spring.application.name=workflow-api
server.port=8080
server.servlet.context-path=/rest

# Module auto-config (set to false to disable; default on when omitted)
workflow.persistence.enabled=true
workflow.messaging.enabled=true

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:workflow}

# gRPC Client Configuration
grpc.client.core-service.address=${GRPC_CLIENT_CORE_SERVICE_ADDRESS:static://localhost:9090}
grpc.client.core-service.negotiation-type=plaintext
grpc.client.core-service.enable-keep-alive=true
grpc.client.core-service.keep-alive-time=30s
grpc.client.core-service.keep-alive-timeout=5s

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.build.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Message Queue (RabbitMQ) Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2000ms
spring.rabbitmq.template.retry.max-attempts=3

# Defer RabbitMQ topology/listener startup until the broker is reachable
workflow.rabbit.retry-interval-ms=5000
