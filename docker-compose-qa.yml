
services:
  qa-mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
  qa-redis:
    image: redis:latest
    ports:
      - "6379:6379"
  qa-neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7687:7687"
      - "7474:7474"
  qa-postgres:
    image: postgres:latest
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

