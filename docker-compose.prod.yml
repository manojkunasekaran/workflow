services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI  →  http://localhost:15672  (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - workflow-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - workflow-network

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - workflow-network

  # ── Backend ──────────────────────────────────────────────────────────
  core:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        APP_MODULE: core
    ports:
      - "8081:8081"
      - "9090:9090"
    env_file:
      - backend/.env
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - workflow-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        APP_MODULE: api
    ports:
      - "8080:8080" # Spring Boot HTTP / REST
    env_file:
      - backend/.env
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0"
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - workflow-network

networks:
  workflow-network:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  rabbitmq_data:
  redis_data:

